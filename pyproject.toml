[project]
name = "pixel-lanka"
version = "0.1.0"
description = "Isometric pixel-art maps of Sri Lanka from Overture/OSM data"
authors = [
    { name = "Maneesha Cooray" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]


[tool.uv]
package = false  # a set of scripts, not an installable package

[tool.pytest.ini_options]
pythonpath = ["pipeline"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
src = ["pipeline", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["B905"]  # zip(ring, ring[1:]) pairs are deliberately uneven
