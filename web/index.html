<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Lanka — Colombo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #201e1c; font: 14px/1.4 ui-monospace, Menlo, monospace; color: #f3eee2; }
  canvas { display: block; image-rendering: pixelated; }
  .chip { background: rgba(32, 30, 28, 0.86); border: 2px solid #4a4540; padding: 8px 12px; }
  #hud { position: fixed; top: 12px; left: 12px; max-width: 340px; }
  #hud h1 { margin: 0 0 4px; font-size: 16px; }
  #hud h1 span { color: #e8b04a; }
  #hud p { margin: 4px 0; color: #c9c2b2; }
  #hud kbd { background: #4a4540; padding: 0 4px; color: #fff; }
  #hud button { font: inherit; background: #e8b04a; color: #201e1c; border: 0; padding: 6px 10px; margin: 6px 6px 0 0; cursor: pointer; }
  #hud button:hover { background: #f5c868; }
  #prompt { position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%); font-size: 16px; }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; background: #fff; mix-blend-mode: difference; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; }
  [hidden] { display: none !important; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Building Colombo…</div>
<div id="hud" class="chip">
  <h1>Pixel <span>Lanka</span> · Colombo</h1>
  <div id="help-fly">
    <p>Drag to pan · right-drag to rotate · scroll to zoom</p>
    <p><kbd>F</kbd> walk at the centre of the view · <kbd>P</kbd> pixel size</p>
    <button id="walk">Walk here</button><button id="lotus">Visit Lotus Tower</button>
  </div>
  <div id="help-walk" hidden>
    <p><kbd>W A S D</kbd> move · mouse look · <kbd>Shift</kbd> run</p>
    <p><kbd>E</kbd> use · <kbd>F</kbd> fly · <kbd>Esc</kbd> release mouse · <kbd>P</kbd> pixel size</p>
    <p id="paused" hidden>Click the map to look around again.</p>
  </div>
</div>
<div id="prompt" class="chip" hidden></div>
<div id="cross" hidden></div>
<script type="module" src="main.js"></script>
</body>
</html>
